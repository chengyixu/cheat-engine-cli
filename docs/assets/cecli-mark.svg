    <rect x="178" y="104" width="14" height="14" rx="3" opacity=".45"/>
    <rect x="156" y="126" width="14" height="14" rx="3" opacity=".45"/>
    <rect x="178" y="126" width="14" height="14" rx="3"/>
    <rect x="156" y="148" width="14" height="14" rx="3"/>
